<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">The Harnett Mesh beginner journey</title>
  <desc id="desc">A six-step journey from learning about Harnett Mesh to sending a message, checking coverage, and participating in the community.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .step { fill: #ffffff; stroke: #2d3748; stroke-width: 2; }
      .num { fill: #087f8c; }
      .line { stroke: #087f8c; stroke-width: 4; }
      .title { fill: #1a202c; font: 600 16px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #4a5568; font: 14px Arial, sans-serif; text-anchor: middle; }
      .white { fill: #ffffff; font: 700 18px Arial, sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/>
    </marker>
  </defs>
  <rect class="bg" width="1000" height="250" rx="18"/>
  <text class="title" x="500" y="34">From curious newcomer to confident community participant</text>
  <g transform="translate(28,75)">
    <rect class="step" width="130" height="105" rx="12"/>
    <circle class="num" cx="65" cy="30" r="18"/><text class="white" x="65" y="36">1</text>
    <text class="title" x="65" y="68">Learn</text><text class="small" x="65" y="88">What it is</text>
  </g>
  <g transform="translate(190,75)">
    <rect class="step" width="130" height="105" rx="12"/>
    <circle class="num" cx="65" cy="30" r="18"/><text class="white" x="65" y="36">2</text>
    <text class="title" x="65" y="68">Prepare</text><text class="small" x="65" y="88">Choose equipment</text>
  </g>
  <g transform="translate(352,75)">
    <rect class="step" width="130" height="105" rx="12"/>
    <circle class="num" cx="65" cy="30" r="18"/><text class="white" x="65" y="36">3</text>
    <text class="title" x="65" y="68">Connect</text><text class="small" x="65" y="88">Set up your device</text>
  </g>
  <g transform="translate(514,75)">
    <rect class="step" width="130" height="105" rx="12"/>
    <circle class="num" cx="65" cy="30" r="18"/><text class="white" x="65" y="36">4</text>
    <text class="title" x="65" y="68">Message</text><text class="small" x="65" y="88">Send a first note</text>
  </g>
  <g transform="translate(676,75)">
    <rect class="step" width="130" height="105" rx="12"/>
    <circle class="num" cx="65" cy="30" r="18"/><text class="white" x="65" y="36">5</text>
    <text class="title" x="65" y="68">Explore</text><text class="small" x="65" y="86">Channels and</text><text class="small" x="65" y="102">coverage</text>
  </g>
  <g transform="translate(838,75)">
    <rect class="step" width="130" height="105" rx="12"/>
    <circle class="num" cx="65" cy="30" r="18"/><text class="white" x="65" y="36">6</text>
    <text class="title" x="65" y="68">Participate</text><text class="small" x="65" y="86">Practice and</text><text class="small" x="65" y="102">contribute</text>
  </g>
  <path class="line" marker-end="url(#arrow)" d="M158 128 H182"/>
  <path class="line" marker-end="url(#arrow)" d="M320 128 H344"/>
  <path class="line" marker-end="url(#arrow)" d="M482 128 H506"/>
  <path class="line" marker-end="url(#arrow)" d="M644 128 H668"/>
  <path class="line" marker-end="url(#arrow)" d="M806 128 H830"/>
</svg>
