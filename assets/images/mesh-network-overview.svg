<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="title desc">
  <title id="title">How a Harnett Mesh message can travel</title>
  <desc id="desc">A phone connects to a radio device. The radio can communicate directly with another device or through shared mesh infrastructure before reaching another community member.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .card { fill: #ffffff; stroke: #2d3748; stroke-width: 2; }
      .accent { fill: #e6fffa; stroke: #087f8c; stroke-width: 2; }
      .line { stroke: #087f8c; stroke-width: 4; fill: none; }
      .dash { stroke: #718096; stroke-width: 3; stroke-dasharray: 9 8; fill: none; }
      .label { fill: #1a202c; font: 600 20px Arial, sans-serif; text-anchor: middle; }
      .small { fill: #4a5568; font: 16px Arial, sans-serif; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#087f8c"/>
    </marker>
  </defs>
  <rect class="bg" width="900" height="430" rx="18"/>
  <text class="label" x="450" y="42">A community message path</text>
  <text class="small" x="450" y="70">LoRa radio links can work without cellular service or Internet access.</text>

  <rect class="card" x="45" y="145" width="170" height="120" rx="14"/>
  <text class="label" x="130" y="190">Your phone</text>
  <text class="small" x="130" y="220">Message app</text>

  <rect class="accent" x="270" y="145" width="170" height="120" rx="14"/>
  <text class="label" x="355" y="190">Your radio</text>
  <text class="small" x="355" y="220">MeshCore device</text>

  <rect class="accent" x="505" y="115" width="170" height="120" rx="14"/>
  <text class="label" x="590" y="160">Shared mesh</text>
  <text class="small" x="590" y="190">Infrastructure</text>
  <text class="small" x="590" y="212">(generalized)</text>

  <rect class="card" x="685" y="260" width="170" height="120" rx="14"/>
  <text class="label" x="770" y="305">Another user</text>
  <text class="small" x="770" y="335">Radio and phone</text>

  <path class="line" marker-end="url(#arrow)" d="M215 205 H265"/>
  <path class="line" marker-end="url(#arrow)" d="M440 190 H500"/>
  <path class="line" marker-end="url(#arrow)" d="M650 220 Q700 250 710 275"/>
  <path class="dash" marker-end="url(#arrow)" d="M440 235 Q570 330 680 330"/>
  <text class="small" x="560" y="365">A direct path may also be possible</text>
</svg>
